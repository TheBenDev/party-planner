syntax = "proto3";
package planner.v1;

message MapHex {
  string id = 1;
  string campaign_id = 2;
  int32 q = 3;
  int32 r = 4;
  string terrain = 5;
  optional string label = 6;
}

message GetCampaignMapRequest {
  string campaign_id = 1;
}

message GetCampaignMapResponse {
  repeated MapHex hexes = 1;
}

message UpsertMapHexRequest {
  string campaign_id = 1;
  int32 q = 2;
  int32 r = 3;
  string terrain = 4;
  optional string label = 5;
}

message UpsertMapHexResponse {
  MapHex hex = 1;
}

message ClearMapHexRequest {
  string campaign_id = 1;
  int32 q = 2;
  int32 r = 3;
}

message ClearMapHexResponse {}

service MapService {
  rpc GetCampaignMap(GetCampaignMapRequest) returns (GetCampaignMapResponse);
  rpc UpsertMapHex(UpsertMapHexRequest) returns (UpsertMapHexResponse);
  rpc ClearMapHex(ClearMapHexRequest) returns (ClearMapHexResponse);
}
